name: Docker Build
on: [push]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Docker images
      run: |
        make artifacts.tag latest.tag alpine.tag
